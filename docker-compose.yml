version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tourism_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tourism_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: tourism_web
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/tourism_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL}
      - PRO_MODEL=${PRO_MODEL}
    depends_on:
      - db

volumes:
  pgdata:
